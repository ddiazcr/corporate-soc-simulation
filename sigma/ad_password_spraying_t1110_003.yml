title: Active Directory Password Spraying - One Source, Many Accounts
id: 5124d2c3-29e5-45f9-9878-767dedf4e833
status: experimental
description: |
    One source IP fails authentication against several different accounts, one
    attempt each, to stay under per-account lockout thresholds. This is the
    inverse of brute force and the signature of password spraying.
    Lab equivalent: Wazuh rule 100201 (NTLM / event 4625). A Kerberos variant
    (event 4771) is detected by Wazuh rules 100202 -> 100203.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Daniel Diaz (ddiazcr)
date: 2026-11-03
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    timeframe: 2m
    condition: selection | count(TargetUserName) by IpAddress >= 6
fields:
    - IpAddress
    - TargetUserName
falsepositives:
    - A misconfigured service touching several accounts from one host
level: high
tags:
    - attack.credential-access
    - attack.t1110.003
