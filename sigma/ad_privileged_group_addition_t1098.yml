title: Member Added to a Privileged Active Directory Group
id: 3fed8a86-be01-494d-a835-93490052bac3
status: experimental
description: |
    A member is ADDED to a privileged group - Administrators (4732), global
    groups such as Domain Admins (4728), or universal groups such as Enterprise
    Admins (4756). Additions to these groups change the blast radius of the
    domain and should always be reviewed.
    Lab equivalent: Wazuh rule 100220 (keeps additions only, not removals).
references:
    - https://attack.mitre.org/techniques/T1098/
author: Daniel Diaz (ddiazcr)
date: 2026-11-03
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4728
            - 4732
            - 4756
    condition: selection
fields:
    - TargetUserName
    - SubjectUserName
    - MemberName
falsepositives:
    - Planned, change-ticketed privileged-group membership changes
level: high
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
