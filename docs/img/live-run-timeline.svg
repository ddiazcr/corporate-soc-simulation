    .h { font-size: 24px; font-weight: 700; }
    .s { font-size: 16px; fill: #475569; }
    .v { font-size: 22px; font-weight: 700; fill: #0369a1; }
    .l { font-size: 17px; font-weight: 600; }
    .m { font-size: 15px; fill: #64748b; }
  </style>
  <rect x="0" y="0" width="640" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
