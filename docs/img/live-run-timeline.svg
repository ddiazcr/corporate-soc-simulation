  <line x1="48" y1="160" x2="600" y2="160" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="48" y1="160" x2="164.5" y2="160" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <line x1="164.5" y1="160" x2="555.2" y2="160" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>

  <!-- T3 label above the axis (avoids crowding T2) -->
