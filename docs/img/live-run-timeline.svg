  <desc id="desc">From the Enter on DC01 (0 s): alert in the triage feed at 1.90 s, Telegram receives the message at 8.27 s, the feed prints the verdict at 8.73 s. Model verdict latency reported by the pipeline: 5.81 s. Single run, measured on the screen recording.</desc>
  <style>
